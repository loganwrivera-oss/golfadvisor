AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512

Parameters:
  S3ArtifactBucket:
    Type: String
    Description: S3 bucket for deployment artifacts.

Resources:
  # --------------------------------------------------------------------------
  # 1. DynamoDB Table for Storing Handicap Calculations
  # --------------------------------------------------------------------------
  GolfCaddieTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GolfCaddieData
      AttributeDefinitions:
        - AttributeName: CourseID
          AttributeType: S
      KeySchema:
        - AttributeName: CourseID
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: expirationTime
        Enabled: true

  # --------------------------------------------------------------------------
  # 2. Lambda Function to Calculate Handicap (First Step in Workflow)
  # --------------------------------------------------------------------------
  TeeCalcLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TeeCalcLambda
      CodeUri: ../src/
      Handler: lambda_function.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt GolfCaddieTable.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref GolfCaddieTable

  # --------------------------------------------------------------------------
  # 3. Step Functions Role (Execution Role)
  # --------------------------------------------------------------------------
  SFExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SFInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - bedrock:InvokeModel
                Resource: "*"

  # --------------------------------------------------------------------------
  # 4. Step Function State Machine (The Workflow Orchestrator)
  # --------------------------------------------------------------------------
  TeeAdviceWorkflow:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: TeeAdviceWorkflow
      RoleArn: !GetAtt SFExecutionRole.Arn
      DefinitionString:
        # Use !Sub to handle the substitution of the entire JSON string
        !Sub |
          {
            "Comment": "Golf Caddie Handicap Calculation and AI Advice Workflow",
            "StartAt": "CalculateHandicap",
            "States": {
              "CalculateHandicap": {
                "Type": "Task",
                "Resource": "arn:aws:states:::lambda:invoke",
                "Parameters": {
                  "FunctionName": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TeeCalcLambda}",
                  "Payload.$": "$"
                },
                "Retry": [{
                    "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                    "IntervalSeconds": 2,
                    "MaxAttempts": 6,
                    "BackoffRate": 2
                }],
                "Catch": [{
                    "ErrorEquals": ["States.ALL"],
                    "Next": "FailedState"
                }],
                "Next": "AISuggestionTask"
              },
              "AISuggestionTask": {
                "Type": "Task",
                "Resource": "arn:aws:states:::bedrock:invokeModel",
                "Parameters": {
                  "ModelId": "anthropic.claude-3-5-sonnet",
                  "ContentType": "application/json",
                  "Accept": "application/json",
                  "Body": {
                    "prompt.$": "States.Format('Based on Course Handicap {}, suggest a tee strategy.', $.Payload.courseHandicap)"
                  }
                },
                "Next": "SuccessState"
              },
              "SuccessState": {
                "Type": "Succeed"
              },
              "FailedState": {
                "Type": "Fail",
                "Cause": "The workflow failed to complete successfully."
              }
            }
          }

  # --------------------------------------------------------------------------
  # 5. API Gateway (Entry Point)
  # --------------------------------------------------------------------------
  TeeAdviceAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: TeeAdviceAPI
      StageName: Prod
      DefinitionBody:
        swagger: '2.0'
        info:
          title: "TeeAdviceAPI"
        paths:
          /advice:
            post:
              consumes:
                - application/json
              produces:
                - application/json
              parameters:
                - in: "body"
                  name: "body"
                  schema:
                    $ref: "#/definitions/HandicapInput"
              x-amazon-apigateway-integration:
                uri:
                  !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
                credentials: !GetAtt APIGWRole.Arn
                passthroughBehavior: WHEN_NO_MATCH
                httpMethod: POST
                type: AWS
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-amz-json-1.0'"
                requestTemplates:
                  application/json: |
                    {
                      "input": "$input.json('$')",
                      "stateMachineArn": "${TeeAdviceWorkflow}"
                    }
              responses:
                '200':
                  description: "200 response"
                  schema:
                    $ref: "#/definitions/HandicapOutput"
        definitions:
          HandicapInput:
            type: object
            properties:
              courseID:
                type: string
              teeMarker:
                type: string
              rating:
                type: number
              slope:
                type: integer
              handicapIndex:
                type: number
          HandicapOutput:
            type: object
            properties:
              courseHandicap:
                type: integer
              advice:
                type: string

  # --------------------------------------------------------------------------
  # 6. API Gateway Role (Used by API Gateway to call Step Functions)
  # --------------------------------------------------------------------------
  APIGWRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: APIGWInvokeSFPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt TeeAdviceWorkflow.Arn

# --------------------------------------------------------------------------
# 7. Stack Outputs (To retrieve the public API URL)
# --------------------------------------------------------------------------
Outputs:
  TeeAdviceAPIEndpoint:
    Description: "API Gateway URL for the Tee Advice Workflow"
    Value: !Sub "https://${TeeAdviceAPI}.execute-api.${AWS::Region}.amazonaws.com/Prod/advice"
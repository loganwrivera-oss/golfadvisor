AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
Parameters:
  S3ArtifactBucket:
    Type: String
    Description: S3 bucket for deployment artifacts.
Resources:
  GolfCaddieTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: GolfCaddieData
      AttributeDefinitions:
      - AttributeName: CourseID
        AttributeType: S
      KeySchema:
      - AttributeName: CourseID
        KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: expirationTime
        Enabled: true
  TeeCalcLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: TeeCalcLambda
      CodeUri: s3://golf-caddie-artifacts-2025/45f597a716fd1ad3c19986b81a808413
      Handler: lambda_function.lambda_handler
      Policies:
      - Statement:
        - Effect: Allow
          Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          Resource:
            Fn::GetAtt:
            - GolfCaddieTable
            - Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME:
            Ref: GolfCaddieTable
  SFExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: states.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: SFInvokePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - lambda:InvokeFunction
            - bedrock:InvokeModel
            Resource: '*'
  TeeAdviceWorkflow:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: TeeAdviceWorkflow
      RoleArn:
        Fn::GetAtt:
        - SFExecutionRole
        - Arn
      DefinitionString:
        Fn::Sub: "{\n  \"Comment\": \"Golf Caddie Handicap Calculation and AI Advice\
          \ Workflow\",\n  \"StartAt\": \"CalculateHandicap\",\n  \"States\": {\n\
          \    \"CalculateHandicap\": {\n      \"Type\": \"Task\",\n      \"Resource\"\
          : \"arn:aws:states:::lambda:invoke\",\n      \"Parameters\": {\n       \
          \ \"FunctionName\": \"arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${TeeCalcLambda}\"\
          ,\n        \"Payload.$\": \"$\"\n      },\n      \"Retry\": [{\n       \
          \   \"ErrorEquals\": [\"Lambda.ServiceException\", \"Lambda.AWSLambdaException\"\
          , \"Lambda.SdkClientException\"],\n          \"IntervalSeconds\": 2,\n \
          \         \"MaxAttempts\": 6,\n          \"BackoffRate\": 2\n      }],\n\
          \      \"Catch\": [{\n          \"ErrorEquals\": [\"States.ALL\"],\n   \
          \       \"Next\": \"FailedState\"\n      }],\n      \"Next\": \"AISuggestionTask\"\
          \n    },\n    \"AISuggestionTask\": {\n      \"Type\": \"Task\",\n     \
          \ \"Resource\": \"arn:aws:states:::bedrock:invokeModel\",\n      \"Parameters\"\
          : {\n        \"ModelId\": \"arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-5-sonnet\"\
          ,\n        \"ContentType\": \"application/json\",\n        \"Accept\": \"\
          application/json\",\n        \"Body\": {\n          \"prompt.$\": \"States.Format('Based\
          \ on Course Handicap {}, suggest a tee strategy.', $.Payload.courseHandicap)\"\
          \n        }\n      },\n      \"Next\": \"SuccessState\"\n    },\n    \"\
          SuccessState\": {\n      \"Type\": \"Succeed\"\n    },\n    \"FailedState\"\
          : {\n      \"Type\": \"Fail\",\n      \"Cause\": \"The workflow failed to\
          \ complete successfully.\"\n    }\n  }\n}\n"
  TeeAdviceAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: TeeAdviceAPI
      StageName: Prod
      DefinitionBody:
        swagger: '2.0'
        info:
          title: TeeAdviceAPI
        paths:
          /advice:
            post:
              consumes:
              - application/json
              produces:
              - application/json
              parameters:
              - in: body
                name: body
                schema:
                  $ref: '#/definitions/HandicapInput'
              x-amazon-apigateway-integration:
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:states:action/StartExecution
                credentials:
                  Fn::GetAtt:
                  - APIGWRole
                  - Arn
                passthroughBehavior: WHEN_NO_MATCH
                httpMethod: POST
                type: AWS
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-amz-json-1.0'"
                requestTemplates:
                  application/json: "{\n  \"input\": \"$input.json('$')\",\n  \"stateMachineArn\"\
                    : \"${TeeAdviceWorkflow}\"\n}\n"
              responses:
                '200':
                  description: 200 response
                  schema:
                    $ref: '#/definitions/HandicapOutput'
        definitions:
          HandicapInput:
            type: object
            properties:
              courseID:
                type: string
              teeMarker:
                type: string
              rating:
                type: number
              slope:
                type: integer
              handicapIndex:
                type: number
          HandicapOutput:
            type: object
            properties:
              courseHandicap:
                type: integer
              advice:
                type: string
  APIGWRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: apigateway.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: APIGWInvokeSFPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: states:StartExecution
            Resource:
              Fn::GetAtt:
              - TeeAdviceWorkflow
              - Arn
Outputs:
  TeeAdviceAPIEndpoint:
    Description: API Gateway URL for the Tee Advice Workflow
    Value:
      Fn::Sub: https://${TeeAdviceAPI}.execute-api.${AWS::Region}.amazonaws.com/Prod/advice
